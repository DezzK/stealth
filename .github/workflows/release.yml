name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build"
        required: true

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    env:
      # The tag being released: the one a manual run asks for, otherwise the pushed tag.
      # Checkout builds it too, so a manual run builds that tag rather than the branch it
      # was dispatched from.
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ env.RELEASE_TAG }}
        submodules: recursive

    - name: Determine version
      id: version
      run: |
        echo "version=${RELEASE_TAG}" >> $GITHUB_OUTPUT
        echo "version=${RELEASE_TAG}"

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4

    - name: Decode Keystore
      run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build release APKs
      env:
        VERSION_NAME: ${{ steps.version.outputs.version }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        ./gradlew assembleRelease

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: Release ${{ steps.version.outputs.version }}
        draft: false
        prerelease: false
        files: app/build/outputs/apk/release/stealth-${{ steps.version.outputs.version }}.apk
